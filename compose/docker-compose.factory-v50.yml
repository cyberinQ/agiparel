# Author: Sunil Jain, 2026-11-12.
# Isolated LOCAL PILOT stack. Not a production/customer onboarding deployment.
# Mandatory: docker compose -p agiparel-v50-pilot --env-file .env.factory-v50 -f compose/docker-compose.factory-v50.yml
name: agiparel-v50-pilot
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agiparel_dev
      POSTGRES_USER: agiparel_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set PostgreSQL password in .env.factory-v50}
      AGIPAREL_APP_DB_PASSWORD: ${AGIPAREL_APP_DB_PASSWORD:?Set app DB password}
      AGIPAREL_DOC_DB_PASSWORD: ${AGIPAREL_DOC_DB_PASSWORD:?Set document worker password}
    volumes:
      - pilot_postgres:/var/lib/postgresql/data
      - ../scripts/bootstrap_roles_v42.sql:/etc/agiparel/bootstrap_roles_v42.sql:ro
      - ../scripts/init_db_roles_v42.sh:/docker-entrypoint-initdb.d/01_roles.sh:ro
      - ../services/core-api/migrations/0001_v42_baseline.sql:/docker-entrypoint-initdb.d/02_baseline.sql:ro
      - ../services/core-api/migrations/0002_engineer_ops_aggregates_v43_2.sql:/docker-entrypoint-initdb.d/03_ops.sql:ro
      - ../services/core-api/migrations/0005_cut_sop2_control_plane_v46.sql:/docker-entrypoint-initdb.d/05_cut_sop2.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agiparel_admin -d agiparel_dev"]
      interval: 5s
      retries: 12
      timeout: 3s
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - pilot_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
      timeout: 3s
  ollama:
    image: ${AGIPAREL_OLLAMA_IMAGE:?Ollama digest-pinned image required}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - pilot_ollama:/root/.ollama
    # No public Ollama port; accessible only to the AGIPAREL container network.
  aerolake-agentd:
    image: ${AGIPAREL_AEROLAKE_IMAGE:?Provide approved digest-pinned Aerolake image}
    restart: unless-stopped
    user: "10001:10001"
    environment:
      AEROLAKE_NODE_ID: local-pilot-only
      AEROLAKE_LISTEN_ADDR: 0.0.0.0:51051
      AEROLAKE_PGWIRE_ADDR: 0.0.0.0:5432
      AEROLAKE_METRICS_ADDR: 0.0.0.0:9090
      AEROLAKE_DATA_DIR: /var/lib/aerolake/data
      AEROLAKE_PARQUET_DIR: /var/lib/aerolake/parquet_data
      AEROLAKE_WAL_DIR: /var/lib/aerolake/wal
      AEROLAKE_OUTBOX_DIR: /var/lib/aerolake/outbox
    volumes:
      - pilot_aerolake_wal:/var/lib/aerolake/wal
      - pilot_aerolake_parquet:/var/lib/aerolake/parquet_data
      - pilot_aerolake_outbox:/var/lib/aerolake/outbox
    # No host ports. Live data-transfer/archival verification is NOT implemented.
  aerolake-bridge:
    build:
      context: ..
      dockerfile: services/aerolake-bridge/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://agiparel_app:${AGIPAREL_APP_DB_PASSWORD:?Set app DB password}@postgres:5432/agiparel_dev?sslmode=disable
      AEROLAKE_FLIGHT_ENDPOINT: aerolake-agentd:51051
      AEROLAKE_PRUNING_KILL_SWITCH: "true"
    depends_on:
      postgres:
        condition: service_healthy
      aerolake-agentd:
        condition: service_started
  plant-edge-os:
    build:
      context: ..
      dockerfile: services/edge-daemon/Dockerfile
    restart: unless-stopped
    environment:
      ENV: development
      AGIPAREL_RELEASE: v50-local-pilot
      DATABASE_URL: postgres://agiparel_app:${AGIPAREL_APP_DB_PASSWORD:?Set app DB password}@postgres:5432/agiparel_dev?sslmode=disable
      LEDGER_SECRET: ${LEDGER_HMAC_SECRET:?Set pilot ledger secret}
      WAL_PATH: /data/wal/events.wal
      PORT: "18530"
      AGIPAREL_OPERATOR_USER: ${AGIPAREL_OPERATOR_USER:?Set pilot operator name}
      AGIPAREL_OPERATOR_PASSWORD: ${AGIPAREL_OPERATOR_PASSWORD:?Set pilot operator password}
      AGIPAREL_OPERATOR_TENANT: dev
      AGIPAREL_FACTORY_TIMEZONE: ${AGIPAREL_FACTORY_TIMEZONE:?Set factory IANA time zone}
      OLLAMA_HOST: http://ollama:11434
      AGIE_MODEL: ${AGIE_MODEL:?Select installed Ollama model}
      AGIPAREL_CUT_SOP2_WRITES_ENABLED: "false"
      AGIPAREL_PUBLIC_CUTTER_DEMO_ENABLED: "false"
      AGIPAREL_CAPTURE_FIRST: "true"
    ports:
      - "127.0.0.1:${AGIPAREL_PILOT_PORT:-18539}:18530"
    volumes:
      - pilot_wal:/data/wal
      - pilot_docs:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
  document-intake:
    build:
      context: ..
      dockerfile: services/document-intake/Dockerfile
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      DOCUMENT_WORKER_DATABASE_URL: postgres://agiparel_doc_worker:${AGIPAREL_DOC_DB_PASSWORD:?Set document password}@postgres:5432/agiparel_dev?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pilot_postgres:
  pilot_redis:
  pilot_ollama:
  pilot_aerolake_wal:
  pilot_aerolake_parquet:
  pilot_aerolake_outbox:
  pilot_wal:
  pilot_docs:
