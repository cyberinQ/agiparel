version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agiparel-postgres
    restart: always
    env_file:
      - ./env/dev.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../services/core-api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agiparel_app -d agiparel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
