# Author: Sunil Jain, 2026-10-25 — Make Ollama models selectable without rebuilding Go binaries.
services:
  postgres:
    image: postgres:16-alpine
    container_name: agiparel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agiparel_dev}
      POSTGRES_USER: ${POSTGRES_USER:-agiparel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secret_vault_pg16}
      AGIPAREL_APP_DB_PASSWORD: ${AGIPAREL_APP_DB_PASSWORD:?Generate local .env using v42 installer}
      AGIPAREL_DOC_DB_PASSWORD: ${AGIPAREL_DOC_DB_PASSWORD:?Generate local .env using v42 installer}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/bootstrap_roles_v42.sql:/etc/agiparel/bootstrap_roles_v42.sql:ro
      - ../scripts/init_db_roles_v42.sh:/docker-entrypoint-initdb.d/01_roles.sh:ro
      - ../services/core-api/migrations/0001_v42_baseline.sql:/docker-entrypoint-initdb.d/02_baseline.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agiparel_admin} -d ${POSTGRES_DB:-agiparel_dev}"]
      interval: 3s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7.2-alpine
    container_name: agiparel-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
  plant-edge-os:
    build:
      context: ..
      dockerfile: services/edge-daemon/Dockerfile
    container_name: agiparel-edge-daemon
    restart: unless-stopped
    environment:
      ENV: ${ENVIRONMENT:-development}
      PORT: ${EDGE_DAEMON_PORT:-18530}
      LEDGER_SECRET: ${LEDGER_HMAC_SECRET:-c9b2e61a4f8d073e51a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f7a8}
      WAL_PATH: "/data/wal/events.wal"
      ENABLED_MODULES: ${ENABLED_MODULES:-mod_stores,mod_cutting,mod_sewing,mod_packing,mod_ocr}
      
      DATABASE_URL: "postgres://agiparel_app:${AGIPAREL_APP_DB_PASSWORD:?Missing app DB secret}@postgres:5432/${POSTGRES_DB:-agiparel_dev}?sslmode=disable"

      OLLAMA_HOST: "http://host.docker.internal:11434"
      AGIE_MODEL: ${AGIE_MODEL:-qwen3-coder:30b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:8b}
      MANAGER_PIN: ${MANAGER_PIN:-}
      # DEV-only Basic barrier for legacy HMI/API routes; never use for production identity.
      AGIPAREL_OPERATOR_USER: ${AGIPAREL_OPERATOR_USER:-dev}
      AGIPAREL_OPERATOR_PASSWORD: ${AGIPAREL_OPERATOR_PASSWORD:-1212}
      # DEV-ONLY: explicitly enabled reviewer; never a production workforce role.
      AGIPAREL_REVIEW_MANAGER_USER: ${AGIPAREL_REVIEW_MANAGER_USER:-}
      # DEVELOPMENT ONLY: server-pinned tenant for operator intake; never accept client-supplied tenant.
      AGIPAREL_OPERATOR_TENANT: ${AGIPAREL_OPERATOR_TENANT:-dev}
      # Safety bridge: the older Planning uploader must capture, not auto-merge.
      AGIPAREL_CAPTURE_FIRST: "true"
      AGIPAREL_CLAMD_ADDR: ${AGIPAREL_CLAMD_ADDR:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - edge_wal_v42:/data/wal
      - ../data:/app/data
    ports:
      - "${EDGE_DAEMON_PORT:-18530}:18530"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  document-intake:
    build:
      context: ..
      dockerfile: services/document-intake/Dockerfile
    container_name: agiparel-document-intake
    restart: unless-stopped
    environment:
      # Development-only, document-table restricted DB role. No factory write privileges.
      DOCUMENT_WORKER_DATABASE_URL: "postgres://agiparel_doc_worker:${AGIPAREL_DOC_DB_PASSWORD:?Missing doc DB secret}@postgres:5432/${POSTGRES_DB:-agiparel_dev}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    # Intentionally no public ports; worker only polls PostgreSQL document jobs.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

volumes:
  pgdata:
  redisdata:
  edge_wal_v42: