services:
  aerolake-agentd:
    build:
      context: ../../aerolake
      dockerfile: deploy/docker/Dockerfile.agentd
    container_name: aerolake-agentd
    restart: unless-stopped
    ports:
      - "51051:51051" # Arrow Flight SQL
      - "25432:5432"  # PGWire Server
      - "9090:9090"   # Prometheus Exporter
    volumes:
      - aerolake-storage:/var/lib/aerolake/parquet_data
    networks:
      - default

  aerolake-bridge:
    build:
      context: ..
      dockerfile: services/aerolake-bridge/Dockerfile
    container_name: aerolake-bridge
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://agiparel_admin:dev_secret_vault_pg16@agiparel-postgres:5432/agiparel_dev?sslmode=disable
      AEROLAKE_FLIGHT_ADDR: aerolake-agentd:51051
      AEROLAKE_FLIGHT_ENDPOINT: aerolake-agentd:51051
    depends_on:
      - aerolake-agentd
    networks:
      - default

volumes:
  aerolake-storage:

networks:
  default:
    name: compose_default
    external: true
