<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SEW-01 · Operator HMI Terminal</title>
  <style>
    :root {
      --bg: #121214;
      --card: #1F1F23;
      --text: #F9FAFB;
      --green: #10B981;
      --amber: #F59E0B;
      --red: #DC2626;
      --disabled: #374151;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      overflow: hidden;
    }
    header {
      background: var(--card);
      padding: 16px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .station-title {
      font-size: 1.4rem;
      font-weight: 800;
    }
    .badge {
      background: #2563EB;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .timer-container {
      width: 100%;
      height: 14px;
      background: var(--disabled);
      border-radius: 7px;
      overflow: hidden;
      margin: 14px 0;
    }
    .timer-bar {
      width: 0%;
      height: 100%;
      background: var(--green);
      transition: width 0.1s linear;
    }
    .button-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      justify-content: center;
    }
    button {
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      transition: transform 0.08s ease;
    }
    button:active { transform: scale(0.97); }

    /* Green Circle: CYCLE DONE */
    .btn-done {
      flex: 2;
      background: var(--green);
      border-radius: 20px;
      font-size: 2.2rem;
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }
    .btn-done:disabled {
      background: var(--disabled);
      color: #9CA3AF;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .aux-row {
      display: flex;
      gap: 16px;
      flex: 1;
    }
    /* Amber Triangle: DEFECT */
    .btn-defect {
      flex: 1;
      background: var(--amber);
      border-radius: 16px;
      font-size: 1.5rem;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    /* Red Octagon: ANDON/HELP */
    .btn-help {
      flex: 1;
      background: var(--red);
      border-radius: 16px;
      font-size: 1.5rem;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
    }
    footer {
      font-size: 0.95rem;
      color: #9CA3AF;
      text-align: center;
      padding-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="station-title">LINE 14 · ST-04</div>
    <div class="badge">BACK RISE JOIN (SAM: 36s)</div>
  </header>

  <div class="timer-container">
    <div class="timer-bar" id="timer-bar"></div>
  </div>

  <div class="button-grid">
    <button class="btn-done" id="btn-done" disabled onclick="onCycleDone()">
      ● CYCLE DONE
    </button>
    <div class="aux-row">
      <button class="btn-defect" onclick="onDefect()">
        ▲ DEFECT
      </button>
      <button class="btn-help" onclick="onHelp()">
        🛑 ANDON / HELP
      </button>
    </div>
  </div>

  <footer>
    <span id="dwell-label">LOCKED: 14.4s Anti-Ghost Dwell Floor</span> | Agiparel Edge OS
  </footer>

  <script>
    const SAM_SEC = 36.0;
    const DWELL_SEC = SAM_SEC * 0.40; // 14.4 seconds anti-ghost dwell floor
    let cycleStart = Date.now();

    function updateDwell() {
      const elapsed = (Date.now() - cycleStart) / 1000;
      const progress = Math.min(100, (elapsed / DWELL_SEC) * 100);
      document.getElementById("timer-bar").style.width = progress + "%";

      const btn = document.getElementById("btn-done");
      const label = document.getElementById("dwell-label");
      if (elapsed >= DWELL_SEC) {
        btn.disabled = false;
        label.innerText = "READY FOR SCAN / TAP";
      } else {
        btn.disabled = true;
        const remain = (DWELL_SEC - elapsed).toFixed(1);
        label.innerText = `LOCKED: ${remain}s Anti-Ghost Dwell Floor`;
      }
    }
    setInterval(updateDwell, 100);

    async function onCycleDone() {
      const elapsed = (Date.now() - cycleStart) / 1000;
      if (elapsed < DWELL_SEC) return;
      cycleStart = Date.now();
      await fetch("/api/v1/ledger/append", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          station_id: "LINE14_ST04",
          operator_id: "W-04",
          event_type: "CYCLE_DONE",
          payload: JSON.stringify({ sam: SAM_SEC, actual_sec: elapsed })
        })
      });
    }

    async function onDefect() {
      await fetch("/api/v1/ledger/append", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          station_id: "LINE14_ST04",
          operator_id: "W-04",
          event_type: "DEFECT_TAG",
          payload: JSON.stringify({ defect: "SEAM_PUCKERING" })
        })
      });
    }

    async function onHelp() {
      await fetch("/api/v1/ledger/append", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          station_id: "LINE14_ST04",
          operator_id: "W-04",
          event_type: "ANDON_CALL",
          payload: JSON.stringify({ reason: "NEEDLE_THREAD_TENSION" })
        })
      });
    }
  </script>
</body>
</html>
