# Author: Sunil Jain, 2026-10-26 — Require tests, vet, race detection and compilation before merging or releasing.
name: Verify Agiparel OS
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression contracts
        run: |
          set -euo pipefail
          for script in scripts/test_*.cjs; do node "$script"; done
      - name: Verify gofmt and patch cleanliness
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          git diff --check
      - name: Static vet
        run: go vet ./...
      - name: Test all packages
        run: go test -count=1 ./...
      - name: Race detection
        run: go test -race -count=1 ./...
      - name: Build all packages
        run: go build ./...

  postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agiparel_dev
          POSTGRES_USER: agiparel_admin
          POSTGRES_PASSWORD: isolated_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agiparel_admin -d agiparel_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: isolated_ci_only_password
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: agiparel_admin
      PGDATABASE: agiparel_dev
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          command -v psql || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
      - name: Bootstrap roles and apply canonical v42 baseline
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -v app_password=ci_app_dev_only -v doc_password=ci_worker_dev_only -f scripts/bootstrap_roles_v42.sql
          psql -X -v ON_ERROR_STOP=1 -f services/core-api/migrations/0001_v42_baseline.sql
          psql -X -v ON_ERROR_STOP=1 -f services/core-api/migrations/0002_engineer_ops_aggregates_v43_2.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v43_2_ops_metrics_pg.sql
      - name: Verify dock and safety schema authorization
        run: |
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_f319c_f319d_f320a_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_f320b_f320d_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v34_tenant_isolation_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v35_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v35_tenant_isolation_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v36_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v36_tenant_isolation_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v37_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v37_isolation_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v38_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v38_tenant_isolation_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v39_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v40_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v41_security_pg.sql
      - name: Concurrency and connection-failure drills on isolated CI database
        env:
          AGIPAREL_TEST_DB_DISPOSABLE: YES
        run: sh scripts/test_factory_v39_concurrency.sh
      - name: Signed dock ingress concurrency and rollback drill
        env:
          AGIPAREL_TEST_DB_DISPOSABLE: YES
        run: sh scripts/test_factory_v40_dock_stress.sh
      - name: Real app-role multi-tenant parallel isolation and revocation
        env:
          AGIPAREL_TEST_DB_DISPOSABLE: YES
        run: sh scripts/test_factory_v41_multitenant_load.sh
