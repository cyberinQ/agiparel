# Author: Sunil Jain, 2026-10-26 — Publish the edge executable only after the exact tagged commit passes CI.
name: Build and Release Agiparel OS
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile release edge binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/plant-edge-os ./services/edge-daemon/cmd/server
          (cd dist && sha256sum plant-edge-os > SHA256SUMS)
      - name: Publish release assets with SHA256 manifest
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/plant-edge-os
            dist/SHA256SUMS
