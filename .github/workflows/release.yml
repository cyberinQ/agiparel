# Author: Sunil Jain, 2026-10-26 — Publish the edge executable only after the exact tagged commit passes CI.
name: Build and Release Agiparel OS
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          for script in scripts/test_*.cjs; do node "$script"; done
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
  release:
    needs: [verify, postgres-schema]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile release edge binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/plant-edge-os ./services/edge-daemon/cmd/server
          (cd dist && sha256sum plant-edge-os > SHA256SUMS)
      - name: Publish release assets with SHA256 manifest
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/plant-edge-os
            dist/SHA256SUMS

  postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agiparel_dev
          POSTGRES_USER: agiparel_admin
          POSTGRES_PASSWORD: isolated_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agiparel_admin -d agiparel_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: isolated_ci_only_password
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: agiparel_admin
      PGDATABASE: agiparel_dev
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          command -v psql || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
      - name: Apply all ordered migrations on empty PostgreSQL 16
        run: |
          set -euo pipefail
          n=0
          for migration in services/core-api/migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            n=$((n+1))
            expected=$(printf '%04d' "$n")
            [[ "$(basename "$migration" | cut -c1-4)" == "$expected" ]] || exit 2
            psql -X -v ON_ERROR_STOP=1 -f "$migration" > /dev/null
          done
          printf 'Successfully applied %d ordered migrations\n' "$n"
      - name: Verify dock and safety schema authorization
        run: |
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_f319c_f319d_f320a_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_f320b_f320d_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v34_tenant_isolation_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v35_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v35_tenant_isolation_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v36_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v36_tenant_isolation_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v37_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v37_isolation_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v38_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v38_tenant_isolation_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v38_schema_pg.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/test_factory_v38_tenant_isolation_pg.sql
